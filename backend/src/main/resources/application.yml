spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:${user.home}/.jobtracker/secrets.properties
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:gemma3:1b}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/mailbox/oauth/callback}
  security:
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  gmail:
    sync-query: 'in:anywhere -in:spam -in:trash (application OR applied OR "your application" OR interview OR candidate OR recruiter OR recruiting OR assessment OR offer OR "next steps" OR unfortunately OR position OR vacancy OR "job alert" OR hiring)'
    initial-days: 30
    max-messages-per-sync: 200
    min-sync-interval-minutes: 5
